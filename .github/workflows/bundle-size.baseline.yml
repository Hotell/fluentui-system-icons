name: Bundle Size Baseline

on:
  push:
    branches:
      - main
    paths:
      - 'packages/react-icons/**'

jobs:
  bundle-size-baseline:
    if: ${{ github.repository_owner == 'microsoft' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - run: npm ci

      - name: Build @fluentui/react-icons
        run: npm run build
        working-directory: packages/react-icons

      - name: Generate and upload bundle size report
        run: |
          npm run bundle-size
          npx monosize upload-report --branch main --commit-sha ${{ github.sha }}
        working-directory: packages/react-icons

      - name: Upload bundle size baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-size-baseline
          path: packages/react-icons/dist/bundle-size/monosize.json
          retention-days: 90